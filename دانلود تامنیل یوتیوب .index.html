<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Thumbnail Finder</title>

<style>
*{
  box-sizing:border-box;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#24244a 0%,#0d0d18 45%,#050509 100%);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:650px;
  background:rgba(20,20,35,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:25px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:20px;
  background:#ff0033;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  box-shadow:0 10px 30px rgba(255,0,50,.35);
}

h1{
  text-align:center;
  margin:18px 0 8px;
  font-size:26px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}

.input-box{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  min-width:0;
  padding:16px;
  border:none;
  outline:none;
  border-radius:14px;
  background:#10101c;
  color:white;
  border:1px solid #303044;
  font-size:14px;
  direction:ltr;
}

input:focus{
  border-color:#ff1744;
}

button{
  border:none;
  cursor:pointer;
  border-radius:14px;
  padding:0 20px;
  color:white;
  font-weight:bold;
  background:linear-gradient(135deg,#ff1744,#ff0033);
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
  filter:brightness(1.1);
}

.message{
  text-align:center;
  color:#ff647e;
  margin-top:15px;
  min-height:22px;
}

.result{
  display:none;
  margin-top:25px;
}

.thumbnail{
  width:100%;
  display:block;
  border-radius:17px;
  border:1px solid #333;
  box-shadow:0 10px 35px rgba(0,0,0,.5);
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.buttons a{
  flex:1;
  text-align:center;
  text-decoration:none;
  color:white;
  padding:14px;
  border-radius:13px;
  background:#242438;
  border:1px solid #393950;
  font-weight:bold;
}

.buttons a:first-child{
  background:#ff1744;
  border-color:#ff1744;
}

.info{
  margin-top:18px;
  padding:15px;
  border-radius:14px;
  background:#10101c;
  color:#aaa;
  font-size:13px;
  line-height:2;
}

@media(max-width:520px){
  .container{
    padding:20px;
  }

  .input-box{
    flex-direction:column;
  }

  button{
    height:50px;
  }

  .buttons{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">▶</div>

  <h1>دانلود تامنیل یوتیوب</h1>
  <div class="subtitle">
    لینک ویدیوی یوتیوب را وارد کن
  </div>

  <div class="input-box">
    <input
      id="youtubeUrl"
      type="text"
      placeholder="https://youtu.be/XXXXXXXXXXX"
      autocomplete="off"
    >

    <button onclick="findThumbnail()">
      دریافت تامنیل
    </button>
  </div>

  <div class="message" id="message"></div>

  <div class="result" id="result">

    <img
      id="thumbnail"
      class="thumbnail"
      alt="YouTube Thumbnail"
    >

    <div class="buttons">

      <a id="openImage"
         href="#"
         target="_blank">
         🖼️ باز کردن تصویر
      </a>

      <a id="downloadImage"
         href="#"
         target="_blank"
         download>
         ⬇️ ذخیره تصویر
      </a>

    </div>

    <div class="info">
      <b>تامنیل پیدا شد ✅</b><br>
      تصویر با کیفیت بالا از خود YouTube دریافت شده است.
    </div>

  </div>

</div>

<script>

function getVideoId(url){

  url = url.trim();

  // youtu.be/VIDEO_ID
  let match = url.match(
    /youtu\.be\/([a-zA-Z0-9_-]{11})/
  );

  if(match){
    return match[1];
  }

  // youtube.com/watch?v=VIDEO_ID
  match = url.match(
    /[?&]v=([a-zA-Z0-9_-]{11})/
  );

  if(match){
    return match[1];
  }

  // youtube.com/shorts/VIDEO_ID
  match = url.match(
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
  );

  if(match){
    return match[1];
  }

  // youtube.com/embed/VIDEO_ID
  match = url.match(
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/
  );

  if(match){
    return match[1];
  }

  return null;
}


function findThumbnail(){

  const input =
    document.getElementById("youtubeUrl");

  const message =
    document.getElementById("message");

  const result =
    document.getElementById("result");

  const thumbnail =
    document.getElementById("thumbnail");

  const openImage =
    document.getElementById("openImage");

  const downloadImage =
    document.getElementById("downloadImage");

  const url = input.value;

  message.textContent = "";
  result.style.display = "none";

  if(!url){

    message.textContent =
      "⚠️ اول لینک ویدیو را وارد کن.";

    return;
  }

  const videoId = getVideoId(url);

  if(!videoId){

    message.textContent =
      "❌ لینک YouTube معتبر نیست.";

    return;
  }

  /*
    maxresdefault.jpg
    بالاترین کیفیت معمول تامنیل YouTube
  */

  const highQuality =
    "https://img.youtube.com/vi/" +
    videoId +
    "/maxresdefault.jpg";

  const fallback =
    "https://img.youtube.com/vi/" +
    videoId +
    "/hqdefault.jpg";

  thumbnail.onload = function(){

    message.textContent = "";

    result.style.display = "block";

    openImage.href = highQuality;

    downloadImage.href = highQuality;
  };

  thumbnail.onerror = function(){

    thumbnail.onerror = null;

    thumbnail.src = fallback;

    openImage.href = fallback;

    downloadImage.href = fallback;

    result.style.display = "block";
  };

  thumbnail.src = highQuality;
}


// با Enter هم اجرا شود
document
.getElementById("youtubeUrl")
.addEventListener("keydown", function(e){

  if(e.key === "Enter"){
    findThumbnail();
  }

});

</script>

</body>
</html>
